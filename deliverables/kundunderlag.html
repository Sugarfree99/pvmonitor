<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV Monitor – vyer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    color: #1b2430; background: #f4f6f9; line-height: 1.4;
  }
  header { padding: 32px 40px 8px; }
  header h1 { margin: 0 0 4px; font-size: 26px; }
  header p { margin: 0; color: #5b6b7b; font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 24px 48px; }
  figure {
    margin: 0 0 30px; background: #fff; border: 1px solid #e3e8ee;
    border-radius: 12px; overflow: hidden;
  }
  figcaption { padding: 14px 20px 4px; font-size: 17px; font-weight: 600; }
  .frame { background: #0c1622; padding: 12px; }
  .frame img { display: block; width: 100%; height: auto; border-radius: 6px; }
  @media print {
    body { background: #fff; }
    figure { break-inside: auto; border: none; }
    figcaption { break-after: avoid; }
  }
</style>
</head>
<body>
<header>
  <h1>PV Monitor – solproduktionsövervakning</h1>
  <p>Vyer i systemet (värden är simulerade).</p>
</header>
<main>
  <figure>
    <figcaption>Översikt</figcaption>
    <div class="frame"><img src="screenshots/view0-oversikt.png" alt="Översikt"></div>
  </figure>
  <figure>
    <figcaption>Produktion idag</figcaption>
    <div class="frame"><img src="screenshots/view1-produktion.png" alt="Produktion idag"></div>
  </figure>
  <figure>
    <figcaption>SOS-anläggningen</figcaption>
    <div class="frame"><img src="screenshots/view2-sos.png" alt="SOS-anläggningen"></div>
  </figure>
  <figure>
    <figcaption>RSYD-anläggningen</figcaption>
    <div class="frame"><img src="screenshots/view3-rsyd.png" alt="RSYD-anläggningen"></div>
  </figure>
  <figure>
    <figcaption>Administration – inloggning</figcaption>
    <div class="frame"><img src="screenshots/admin3-login.png" alt="Admin inloggning"></div>
  </figure>
  <figure>
    <figcaption>Administration – admin</figcaption>
    <div class="frame"><img src="screenshots/admin4-admin-begransad.png" alt="Adminvy"></div>
  </figure>
  <figure>
    <figcaption>Administration – superadmin</figcaption>
    <div class="frame"><img src="screenshots/admin5-superadmin.png" alt="Superadminvy"></div>
  </figure>
</main>
</body>
</html>
